name: document-storage

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://docstore:docstore@db:5432/docstore
  REDIS_URL: redis://redis:6379
  STORAGE_DIR: /data/files
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:14b}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
  OLLAMA_EXTRACT_MODEL: ${OLLAMA_EXTRACT_MODEL:-}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-large}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
  OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-1800}
  EMBED_DIM: ${EMBED_DIM:-1024}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-400}
  OCR_DPI: ${OCR_DPI:-200}
  OCR_MAX_DIMENSION: ${OCR_MAX_DIMENSION:-2000}
  OCR_JPEG_QUALITY: ${OCR_JPEG_QUALITY:-90}
  SPEECH_BASE_URL: ${SPEECH_BASE_URL:-http://host.docker.internal:8090}
  SPEECH_TIMEOUT_S: ${SPEECH_TIMEOUT_S:-60}

networks:
  docstore:
    name: docstore

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docstore
      POSTGRES_PASSWORD: docstore
      POSTGRES_DB: docstore
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - docstore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docstore -d docstore"]
      interval: 5s
      timeout: 5s
      retries: 15
    # No `ports:` — only reachable from other containers on the `docstore`
    # network, by name (db:5432). Use `docker compose exec db psql ...` for
    # a local shell, or temporarily add a ports mapping if you need a GUI
    # client on the host.

  redis:
    image: redis:7-alpine
    networks:
      - docstore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    # No `ports:` — internal to the `docstore` network (redis:6379) only.

  backend:
    build: ./backend
    environment:
      <<: *backend-env
    volumes:
      - ./storage:/data/files
    ports:
      - "8000:8000"
    networks:
      - docstore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *backend-env
    volumes:
      - ./storage:/data/files
    networks:
      - docstore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — this is the address
        # your BROWSER uses to reach the backend directly for uploads
        # (bypasses the Next.js proxy; see app/page.tsx). Point this at
        # https://<DOMAIN_NAME>:<HTTPS_PORT>/backend (omit the port if
        # HTTPS_PORT is 443) so uploads stay on the same HTTPS origin the
        # `nginx` service fronts everything under.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
    # No host port published — reach the UI through `nginx` (below), the
    # only public entrypoint now. Still reachable container-to-container as
    # frontend:3000 (that's what nginx proxies to).
    networks:
      - docstore
    depends_on:
      - backend

  # HTTPS entrypoint and the only service publishing ports to the host now —
  # terminates TLS with the cert generated by scripts/generate-certs.ps1|sh
  # (mounted read-only from ./certs/) and reverse-proxies to frontend/backend
  # under one origin. Run the generate-certs script before `docker compose
  # up` the first time, or nginx will fail to start (missing cert files).
  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-400}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - docstore
    depends_on:
      - frontend
      - backend
